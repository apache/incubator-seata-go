# This is a workflow to build the project.

name: "build"

on:
  push:
    branches: [master]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/build.yml"
  pull_request:
    branches: ["*"]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/build.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "checkout ${{ github.ref }}"
        uses: actions/checkout@v4

      - name: "set up go"
        uses: actions/setup-go@v5
        with:
          go-version: 1.20.14
          cache: true

      - name: "run go build"
        run: go build -v ./...
