# This is a workflow to run golangci-lint on the project.

name: "golang ci lint"

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [master]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - ".github/workflows/golangci-lint.yml"
  pull_request:
    branches: "*"
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - ".github/workflows/golangci-lint.yml"

permissions:
  contents: read
  pull-requests: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "checkout ${{ github.ref }}"
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: "set up go"
        uses: actions/setup-go@v7.0.0
        with:
          # golangci-lint v2.13.2 cannot read Go 1.27 export data.
          go-version: "1.26.9"
          cache: true

      - name: "check gofmt"
        shell: bash
        run: |
          set -euo pipefail
          unformatted=$(git ls-files -z '*.go' | xargs -0 -r gofmt -l)
          if [[ -n "$unformatted" ]]; then
            echo "The following Go files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: "golang ci lint pull request"
        if: ${{ github.event_name == 'pull_request' }}
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.2
          args: --timeout=10m
          only-new-issues: true

      - name: "golang ci lint push"
        if: ${{ github.event_name == 'push' }}
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.2
          args: --timeout=10m --new-from-rev=${{ github.event.before }}
