name: Go vulnerability and SBOM

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ "*" ]
  schedule:
    - cron: "0 4 * * 1"
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Vulnerability scan and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.1"

      - name: Verify modules
        run: |
          go mod download
          go mod verify

      - name: Install security tools
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0

      - name: Generate CycloneDX SBOM
        run: cyclonedx-gomod mod -licenses -test -type library -json -output sbom.cdx.json .

      - name: Run govulncheck
        id: vulnerability-scan
        continue-on-error: true
        shell: bash
        run: |
          set +e
          govulncheck ./... 2>&1 | tee govulncheck.txt
          text_status=${PIPESTATUS[0]}
          govulncheck -json ./... > govulncheck.json
          json_status=$?
          set -e

          printf '%s\n' "$text_status" > govulncheck.exit-code
          if [ "$text_status" -ne 0 ] || [ "$json_status" -ne 0 ]; then
            exit 1
          fi

      - name: Upload security artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: go-security-${{ github.sha }}
          path: |
            govulncheck.txt
            govulncheck.json
            govulncheck.exit-code
            sbom.cdx.json
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce vulnerability scan result
        if: ${{ always() && steps.vulnerability-scan.outcome == 'failure' }}
        run: exit 1
