name: License checker

on:
  pull_request:
    branches: [ master ]
  schedule:
    - cron: "0 18 * * *" # TimeZone: UTC 0

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      has-changes: ${{ steps.changes.outputs.has-changes }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect file changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed_files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          
            if echo "$changed_files" | grep -E '\.(go|java|js|ts|py|c|cpp|h|yml|yaml|json)$|go\.(mod|sum)$|package\.json$|LICENSE|NOTICE|Dockerfile' > /dev/null; then
              echo "has-changes=true" >> $GITHUB_OUTPUT
            else
              echo "has-changes=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "has-changes=true" >> $GITHUB_OUTPUT
          fi
          
          echo "Changed files:"
          echo "$changed_files"

  license-header:
    name: License header
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Check license header
        uses: apache/skywalking-eyes@985866ce7e324454f61e22eb2db2e998db09d6f3
        with:
          log: info
          config: .licenserc.yaml
          mode: check

  dependency-license:
    name: Dependency licenses
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: needs.changes.outputs.has-changes == 'true'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.1"
      - name: Install license-eye
        env:
          GOBIN: ${{ runner.temp }}/go-tools/bin
        run: |
          mkdir -p "$GOBIN"
          go install github.com/apache/skywalking-eyes/cmd/license-eye@47febf5
          echo "$GOBIN" >> "$GITHUB_PATH"
      - name: Check Dependencies Licenses
        run: |
          mkdir -p ./dist-material/
          cp  ./licenses/LICENSE.tpl ./dist-material/LICENSE.tpl
          license-eye dependency resolve --summary ./dist-material/LICENSE.tpl || exit 1
          if [ -f "./dist-material/LICENSE" ]; then
            echo "LICENSE check"
            cat ./dist-material/LICENSE
          fi
      - name: Check Dependencies Licenses Invalid
        run: |
          if ! dependency_check_output="$(license-eye dependency check -v error)"; then
            echo "license-eye dependency check failed"
            exit 1
          fi
          printf '%s\n' "$dependency_check_output"
          if grep -Eq 'GPL|LGPL|ERROR' <<<"$dependency_check_output"; then
            echo "GPL or LGPL dependency LICENSE exists"
            grep -E 'GPL|LGPL|ERROR' <<<"$dependency_check_output"
            exit 1
          fi
