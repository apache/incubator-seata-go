# This is a workflow to run unit tests.

name: "unit test"

on:
  push:
    branches: [master]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/unit-test.yml"
  pull_request:
    branches: "*"
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/unit-test.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    name: "unit test"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: seata_go_test
          MYSQL_ROOT_PASSWORD: seata_go
          MYSQL_USER: seata_go
          MYSQL_PASSWORD: seata_go
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - name: "checkout ${{ github.ref }}"
        uses: actions/checkout@v4

      - name: "set up go"
        uses: actions/setup-go@v5
        with:
          go-version: "1.20.14"
          cache: true

      - name: "run unit tests"
        env:
          SEATA_GO_TEST_MYSQL_DSN: seata_go:seata_go@tcp(127.0.0.1:3306)/seata_go_test
        run: |
          set -o pipefail
          go test -v ./... -race -coverprofile=coverage.out -covermode=atomic -timeout 10m 2>&1 | tee test-output.log

      - name: Upload coverage
        if: success()
        uses: codecov/codecov-action@v4.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          version: v0.6.0
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-diagnostics
          path: |
            coverage.out
            test-output.log
          if-no-files-found: warn
          retention-days: 7
