name: "Unit Test"

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ "*" ]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  # Getty transaction tests still patch methods with gomonkey on newer Go.
  # Keep the full-suite race gate on the declared minimum toolchain while
  # exercising the migrated gRPC transaction tests on current Go below.
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: "Checkout code"
      uses: actions/checkout@v7
      with:
        submodules: true

    - name: "Set up Go"
      uses: actions/setup-go@v7
      with:
        go-version: '1.20.x'
        cache-dependency-path: go.sum

    - name: Shutdown default mysql
      run: sudo service mysql stop

    - name: "Run full unit suite"
      run: go test -v ./... -race -coverprofile=coverage.txt -covermode=atomic -timeout 10m

    - name: "Archive test results"
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: coverage.txt
        retention-days: 7

  grpc-transaction:
    name: gRPC Transaction (${{ matrix.golang }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        golang:
          - '1.20.x'
          - oldstable
          - stable

    steps:
    - name: "Checkout code"
      uses: actions/checkout@v7
      with:
        submodules: true

    - name: "Set up Go"
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.golang }}
        cache-dependency-path: go.sum

    - name: "Check gRPC transaction tests"
      run: |
        go test -run '^TestGrpcGlobalTransactionBegin$' -count=20 ./pkg/tm/transaction/grpc
        go test -race -run '^TestGrpcGlobalTransactionBegin$' -count=20 ./pkg/tm/transaction/grpc
        go test -race -count=1 ./pkg/tm/transaction/grpc
