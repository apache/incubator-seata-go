# This is a workflow to run integration tests via integrate_test.sh.

name: "integrate test"

on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [master]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "integrate_test.sh"
      - ".github/workflows/integrate-test.yml"
  pull_request:
    branches: "*"
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "integrate_test.sh"
      - ".github/workflows/integrate-test.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SAMPLES_REF: 8c7214f476f83a16622fd2c5911aa8d85bdc6ee0
      CI_LOG_DIR: ${{ github.workspace }}/ci-logs
    steps:
      - name: "checkout ${{ github.ref }}"
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: "set up go"
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.3"
          cache: true

      - name: "check Docker and Compose"
        run: |
          docker version
          docker compose version

      - name: "run integrate test"
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_REF: ${{ github.base_ref || github.ref_name }}
        run: ./integrate_test.sh "$HEAD_REPOSITORY" "$HEAD_SHA" "$BASE_REF"

      - name: "upload diagnostics"
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: "integrate test diagnostics"
          path: ci-logs/
          if-no-files-found: warn
          retention-days: 7
